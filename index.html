<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta
name="apple-mobile-web-app-capable"
content="yes"
/>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
/>

<meta
name="theme-color"
content="#020617"
/>

<title> CASH CALC</title>

<style>

@font-face{
font-family:'SF Pro Display';
src:local('SF Pro Display');
}

:root{

--glass:
rgba(255,255,255,.06);

--border:
rgba(255,255,255,.12);

--text:
rgba(255,255,255,.95);

--sub:
rgba(255,255,255,.55);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

-webkit-tap-highlight-color:
transparent;

}

body{

font-family:
'SF Pro Display',
-apple-system,
BlinkMacSystemFont,
sans-serif;

min-height:100vh;

overflow-y:auto;

padding:
max(18px, env(safe-area-inset-top))
18px
max(30px, env(safe-area-inset-bottom));

background:
linear-gradient(
180deg,
#020617,
#081120,
#0b1324
);

display:flex;
justify-content:center;

position:relative;

margin:0;

background-attachment:fixed;

}

body::before{

content:'';

position:fixed;
inset:0;

background:
url('https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1600&auto=format&fit=crop')
center/cover;

filter:
blur(22px)
brightness(.45);

transform:scale(1.08);

z-index:-3;

}

body::after{

content:'';

position:fixed;
inset:0;

background:
radial-gradient(
circle at top,
rgba(0,140,255,.16),
transparent 28%
),

radial-gradient(
circle at bottom,
rgba(255,0,180,.10),
transparent 30%
),

rgba(0,0,0,.32);

z-index:-2;

}

.app{

width:100%;
max-width:430px;

padding:22px;

margin-top:10px;
margin-bottom:40px;

border-radius:44px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(40px)
saturate(180%);

-webkit-backdrop-filter:
blur(40px)
saturate(180%);

border:
1px solid rgba(255,255,255,.10);

box-shadow:
0 20px 70px rgba(0,0,0,.45),

inset 0 1px 1px
rgba(255,255,255,.12);

position:relative;

display:flex;
flex-direction:column;
gap:18px;

overflow:visible;

}

.app::before{

content:'';

position:absolute;
inset:0;

border-radius:44px;

padding:1px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.22),
transparent,
rgba(255,255,255,.08)
);

-webkit-mask:
linear-gradient(#fff 0 0)
content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;

pointer-events:none;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:2px;

}

.title{

font-size:18px;

font-weight:800;

letter-spacing:-2px;

color:white;

}

.install{

width:78px;
height:78px;

border-radius:999px;

border:
1px solid rgba(255,255,255,.16);

background:
rgba(255,255,255,.08);

backdrop-filter:
blur(30px);

-webkit-backdrop-filter:
blur(30px);

color:white;

font-size:36px;

font-weight:300;

cursor:pointer;

box-shadow:

inset 0 1px 1px
rgba(255,255,255,.18),

0 10px 30px
rgba(0,0,0,.22);

transition:.3s;

position:relative;

overflow:hidden;

}

.install::before{

content:'';

position:absolute;
inset:0;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.16),
transparent
);

transform:translateX(-100%);

animation:
shine 4s infinite;

}

.install:active{

transform:scale(.95);

}

@keyframes shine{

100%{
transform:translateX(100%);
}

}

.row2{

display:grid;

grid-template-columns:
1fr 1fr;

gap:18px;

}

.card{

padding:18px;

border-radius:34px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:
blur(24px);

-webkit-backdrop-filter:
blur(24px);

position:relative;

overflow:hidden;

}

.card::before{

content:'';

position:absolute;

width:160px;
height:160px;

background:
radial-gradient(
circle,
rgba(255,255,255,.10),
transparent 70%
);

top:-80px;
right:-80px;

}

.label{

font-size:15px;

font-weight:600;

color:var(--sub);

margin-bottom:16px;

}

.input{

height:92px;

border-radius:28px;

background:
rgba(255,255,255,.06);

border:
1px solid rgba(255,255,255,.08);

display:flex;
align-items:center;

padding:0 24px;

}

.input input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

font-size:34px;

font-weight:700;

font-family:inherit;

}

.unit{

font-size:28px;

font-weight:700;

color:
rgba(255,255,255,.5);

}

.kpi-wrapper{

padding:20px;

border-radius:34px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

}

.kpi-title-main{

font-size:16px;

font-weight:700;

color:var(--sub);

margin-bottom:18px;

}

.kpi-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:18px;

}

.kpi-card{

padding:18px;

border-radius:30px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

display:flex;
flex-direction:column;

gap:18px;

min-height:210px;

}

.kpi-title{

font-size:22px;

font-weight:800;

color:white;

}

.kpi-inputs{

display:flex;

gap:12px;

}

.small{

height:74px;

}

.small input{

font-size:24px;

}

.calc{

width:100%;

height:82px;

border:none;

border-radius:999px;

cursor:pointer;

position:relative;

overflow:hidden;

background:
linear-gradient(
135deg,
rgba(0,140,255,.30),
rgba(170,0,255,.22)
);

backdrop-filter:
blur(40px);

-webkit-backdrop-filter:
blur(40px);

color:white;

font-size:30px;

font-weight:700;

letter-spacing:-1px;

border:
1px solid rgba(255,255,255,.18);

box-shadow:

0 0 30px
rgba(0,140,255,.20),

inset 0 1px 1px
rgba(255,255,255,.18);

transition:.3s;

}

.calc::before{

content:'';

position:absolute;
inset:0;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.18),
transparent
);

transform:translateX(-100%);

animation:
shine 3s infinite;

}

.calc:active{

transform:scale(.98);

}

.results{

padding:24px;

border-radius:34px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

}

.results-title{

font-size:20px;

font-weight:700;

color:white;

margin-bottom:24px;

}

.result-row{

display:flex;
justify-content:space-between;

margin-bottom:22px;

font-size:18px;

color:white;

}

.total{

margin-top:18px;

padding-top:22px;

border-top:
1px solid rgba(255,255,255,.08);

font-size:42px;

font-weight:800;

letter-spacing:-2px;

}

.footer{

margin-top:6px;

text-align:center;

font-size:13px;

color:
rgba(255,255,255,.35);

}

.popup{

position:fixed;

top:40px;
left:50%;

transform:
translateX(-50%)
translateY(-20px);

padding:18px 26px;

border-radius:28px;

background:
rgba(255,255,255,.08);

backdrop-filter:
blur(40px)
saturate(180%);

-webkit-backdrop-filter:
blur(40px)
saturate(180%);

border:
1px solid rgba(255,255,255,.16);

color:white;

font-size:16px;

font-weight:700;

letter-spacing:-.4px;

z-index:9999;

opacity:0;

pointer-events:none;

transition:.45s;

box-shadow:
0 20px 60px rgba(0,0,0,.35);

text-align:center;

max-width:90%;

}

.popup.show{

opacity:1;

transform:
translateX(-50%)
translateY(0);

}

@media(max-width:480px){

.title{
font-size:28px;
}

.row2,
.kpi-grid{
grid-template-columns:1fr;
}

.input input{
font-size:30px;
}

.total{
font-size:34px;
}

}

</style>

</head>

<body>

<div class="app">

<div class="top">

<div class="title">
CASH КАЛЬКУЛЯТОР 
</div>

<button
class="install"
onclick="showPopup()"
>
＋
</button>

</div>

<div class="row2">

<div class="card">

<div class="label">
Ставка в час оклад
</div>

<div class="input">

<input
type="number"
id="rateLunch"
value="199"
/>

<div class="unit">
₽
</div>

</div>

</div>

<div class="card">

<div class="label">
Ставка в час премия 
</div>

<div class="input">

<input
type="number"
id="rateNoLunch"
value="185"
/>

<div class="unit">
₽
</div>

</div>

</div>

</div>

<div class="card">

<div class="label">
Часы за месяц
</div>

<div class="input">

<input
type="number"
id="hours"
value="186"
/>

<div class="unit">
ч
</div>

</div>

</div>

<div class="kpi-wrapper">

<div class="kpi-title-main">
KPI
</div>

<div class="kpi-grid">

<div class="kpi-card">

<div class="kpi-title">
KPI 1
</div>

<div class="kpi-inputs">

<div class="input small">

<input
type="number"
class="kpiPercent"
value="30"
/>

</div>

<div class="input small">

<input
type="number"
class="kpiValue"
value="106"
/>

</div>

</div>

</div>

<div class="kpi-card">

<div class="kpi-title">
KPI 2
</div>

<div class="kpi-inputs">

<div class="input small">

<input
type="number"
class="kpiPercent"
value="30"
/>

</div>

<div class="input small">

<input
type="number"
class="kpiValue"
value="115"
/>

</div>

</div>

</div>

<div class="kpi-card">

<div class="kpi-title">
KPI 3
</div>

<div class="kpi-inputs">

<div class="input small">

<input
type="number"
class="kpiPercent"
value="20"
/>

</div>

<div class="input small">

<input
type="number"
class="kpiValue"
value="101"
/>

</div>

</div>

</div>

<div class="kpi-card">

<div class="kpi-title">
KPI 4
</div>

<div class="kpi-inputs">

<div class="input small">

<input
type="number"
class="kpiPercent"
value="20"
/>

</div>

<div class="input small">

<input
type="number"
class="kpiValue"
value="105"
/>

</div>

</div>

</div>

</div>

</div>

<button
class="calc"
onclick="calculate()"
>
✦ Рассчитать
</button>

<div class="results">

<div class="results-title">
Результаты
</div>

<div class="result-row">
<span>Ставка в час</span>
<span id="rateResult">
199 ₽
</span>
</div>

<div class="result-row">
<span>Оклад</span>
<span id="salaryResult">
0 ₽
</span>
</div>

<div class="result-row">
<span>Бонус KPI</span>
<span id="bonusResult">
0 ₽
</span>
</div>

<div class="result-row total">
<span>Итого</span>
<span id="totalResult">
0 ₽
</span>
</div>

</div>

<div class="footer">
СПИЗЖЕННО У САРАТОВА EGORKIN
</div>

</div>

<div
id="popup"
class="popup"
>
ТЫ ПОМОГ ОБОССАТЬ ОДНОГО ДОЛБОЕБА
</div>

<script>

function format(num){

return new Intl.NumberFormat(
'ru-RU'
).format(num);

}

function calculate(){

const rateLunch =
Number(
document.getElementById(
'rateLunch'
).value
);

const hours =
Number(
document.getElementById(
'hours'
).value
);

const salary =
rateLunch * hours;

const percents =
document.querySelectorAll(
'.kpiPercent'
);

const values =
document.querySelectorAll(
'.kpiValue'
);

let bonus = 0;

for(let i=0;i<4;i++){

bonus +=
Number(percents[i].value)
*
Number(values[i].value)
*
4;

}

const total =
salary + bonus;

document.getElementById(
'rateResult'
).innerText =
format(rateLunch) + ' ₽';

document.getElementById(
'salaryResult'
).innerText =
format(salary) + ' ₽';

document.getElementById(
'bonusResult'
).innerText =
format(bonus) + ' ₽';

document.getElementById(
'totalResult'
).innerText =
format(total) + ' ₽';

}

function showPopup(){

const popup =
document.getElementById(
'popup'
);

popup.classList.add(
'show'
);

setTimeout(()=>{

popup.classList.remove(
'show'
);

},2000);

}

calculate();

</script>

</body>
</html>
