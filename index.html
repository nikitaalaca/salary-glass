<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta
name="apple-mobile-web-app-capable"
content="yes"
/>

<meta
name="theme-color"
content="#020617"
/>

<title>ЗАРПЛАТНЫЙ КАЛЬКУЛЯТОР</title>

<style>

@font-face{
font-family:'SF Pro Display';
src:local('SF Pro Display');
}

:root{

--glass:
rgba(255,255,255,.08);

--border:
rgba(255,255,255,.14);

--text:
rgba(255,255,255,.96);

--sub:
rgba(255,255,255,.58);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
}

body{

font-family:
'SF Pro Display',
-apple-system,
BlinkMacSystemFont,
sans-serif;

min-height:100vh;

overflow-y:auto;

padding:24px;

background:
linear-gradient(
180deg,
#020617,
#071226,
#081426
);

display:flex;
justify-content:center;

position:relative;

}

body::before{

content:'';

position:fixed;
inset:0;

background:
url('https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1600&auto=format&fit=crop')
center/cover;

filter:
blur(18px)
brightness(.45);

transform:scale(1.08);

z-index:-3;

}

body::after{

content:'';

position:fixed;
inset:0;

background:
radial-gradient(
circle at top,
rgba(0,153,255,.18),
transparent 30%
),

radial-gradient(
circle at bottom,
rgba(255,0,153,.12),
transparent 30%
),

rgba(0,0,0,.25);

z-index:-2;

}

.app{

width:100%;
max-width:430px;

padding:22px;

border-radius:44px;

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(40px)
saturate(180%);

-webkit-backdrop-filter:
blur(40px)
saturate(180%);

border:
1px solid rgba(255,255,255,.12);

box-shadow:
0 20px 60px rgba(0,0,0,.45),

inset 0 1px 1px
rgba(255,255,255,.12);

position:relative;

overflow:hidden;

}

.app::before{

content:'';

position:absolute;

inset:-2px;

border-radius:44px;

padding:1px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.35),
rgba(255,255,255,.02),
rgba(255,255,255,.18)
);

-webkit-mask:
linear-gradient(#fff 0 0)
content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;

pointer-events:none;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:28px;

}

.title{

font-size:34px;

font-weight:800;

letter-spacing:-1.8px;

color:white;

}

.install{

padding:14px 22px;

border-radius:999px;

border:
1px solid rgba(255,255,255,.14);

background:
rgba(255,255,255,.08);

color:white;

font-size:20px;

font-weight:700;

backdrop-filter:blur(18px);

box-shadow:
inset 0 1px 1px
rgba(255,255,255,.12);

}

.row2{

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

margin-bottom:18px;

}

.card{

padding:18px;

border-radius:32px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:blur(24px);

box-shadow:
inset 0 1px 1px
rgba(255,255,255,.08);

position:relative;

overflow:hidden;

}

.card::before{

content:'';

position:absolute;

width:120px;
height:120px;

background:
radial-gradient(
circle,
rgba(255,255,255,.14),
transparent 70%
);

top:-40px;
right:-40px;

}

.label{

font-size:15px;

font-weight:500;

color:var(--sub);

margin-bottom:16px;

}

.input{

height:86px;

border-radius:26px;

background:
rgba(255,255,255,.08);

display:flex;
align-items:center;
justify-content:space-between;

padding:0 22px;

border:
1px solid rgba(255,255,255,.08);

}

.input input{

width:100%;

background:none;

border:none;

outline:none;

color:white;

font-size:28px;

font-weight:700;

font-family:inherit;

}

.unit{

color:
rgba(255,255,255,.5);

font-size:20px;

font-weight:700;

}

.kpi-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

margin-top:14px;

}

.kpi-card{

padding:18px;

border-radius:28px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

}

.kpi-title{

font-size:22px;

font-weight:700;

color:white;

margin-bottom:18px;

}

.kpi-inputs{

display:flex;

gap:10px;

}

.small{

height:72px;

}

.small input{

font-size:22px;

}

.calc{

width:100%;

height:78px;

margin-top:26px;

border:none;

border-radius:999px;

cursor:pointer;

position:relative;

overflow:hidden;

background:
linear-gradient(
135deg,
rgba(0,153,255,.25),
rgba(255,0,153,.18)
);

backdrop-filter:blur(30px);

color:white;

font-size:28px;

font-weight:700;

letter-spacing:-.6px;

border:
1px solid rgba(255,255,255,.18);

box-shadow:

0 0 30px
rgba(0,153,255,.22),

inset 0 1px 1px
rgba(255,255,255,.18);

transition:.3s;

}

.calc::before{

content:'';

position:absolute;

inset:0;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.22),
transparent
);

transform:translateX(-100%);

animation:
shine 3s infinite;

}

@keyframes shine{

100%{
transform:translateX(100%);
}

}

.calc:active{

transform:scale(.98);

}

.results{

margin-top:24px;

padding:24px;

border-radius:34px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

}

.results-title{

font-size:18px;

font-weight:700;

color:white;

margin-bottom:24px;

}

.result-row{

display:flex;
justify-content:space-between;

margin-bottom:22px;

font-size:18px;

color:white;

}

.total{

margin-top:18px;

padding-top:22px;

border-top:
1px solid rgba(255,255,255,.08);

font-size:44px;

font-weight:800;

letter-spacing:-2px;

}

.footer{

margin-top:24px;

text-align:center;

font-size:13px;

color:
rgba(255,255,255,.35);

}

@media(max-width:480px){

body{
padding:12px;
}

.title{
font-size:28px;
}

.row2,
.kpi-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="app">

<div class="top">

<div class="title">
ЗАРПЛАТНЫЙ КАЛЬКУЛЯТОР
</div>

<button class="install">
＋
</button>

</div>

<div class="row2">

<div class="card">

<div class="label">
Ставка в час с обедом
</div>

<div class="input">

<input
type="number"
id="rateLunch"
value="199"
/>

<div class="unit">
₽
</div>

</div>

</div>

<div class="card">

<div class="label">
Ставка в час без обеда
</div>

<div class="input">

<input
type="number"
id="rateNoLunch"
value="185"
/>

<div class="unit">
₽
</div>

</div>

</div>

</div>

<div class="card">

<div class="label">
Часы за месяц
</div>

<div class="input">

<input
type="number"
id="hours"
value="186"
/>

<div class="unit">
ч
</div>

</div>

</div>

<div class="card">

<div class="label">
KPI
</div>

<div class="kpi-grid">

<div class="kpi-card">

<div class="kpi-title">
KPI 1
</div>

<div class="kpi-inputs">

<div class="input small">
<input
type="number"
class="kpiPercent"
value="30"
/>
</div>

<div class="input small">
<input
type="number"
class="kpiValue"
value="106"
/>
</div>

</div>

</div>

<div class="kpi-card">

<div class="kpi-title">
KPI 2
</div>

<div class="kpi-inputs">

<div class="input small">
<input
type="number"
class="kpiPercent"
value="30"
/>
</div>

<div class="input small">
<input
type="number"
class="kpiValue"
value="115"
/>
</div>

</div>

</div>

<div class="kpi-card">

<div class="kpi-title">
KPI 3
</div>

<div class="kpi-inputs">

<div class="input small">
<input
type="number"
class="kpiPercent"
value="20"
/>
</div>

<div class="input small">
<input
type="number"
class="kpiValue"
value="101"
/>
</div>

</div>

</div>

<div class="kpi-card">

<div class="kpi-title">
KPI 4
</div>

<div class="kpi-inputs">

<div class="input small">
<input
type="number"
class="kpiPercent"
value="20"
/>
</div>

<div class="input small">
<input
type="number"
class="kpiValue"
value="105"
/>
</div>

</div>

</div>

</div>

</div>

<button
class="calc"
onclick="calculate()"
>
✦ Рассчитать
</button>

<div class="results">

<div class="results-title">
Результаты
</div>

<div class="result-row">
<span>Ставка в час</span>
<span id="rateResult">
199 ₽
</span>
</div>

<div class="result-row">
<span>Оклад</span>
<span id="salaryResult">
0 ₽
</span>
</div>

<div class="result-row">
<span>Бонус KPI</span>
<span id="bonusResult">
0 ₽
</span>
</div>

<div class="result-row total">
<span>Итого</span>
<span id="totalResult">
0 ₽
</span>
</div>

</div>

<div class="footer">
EGORKIN COPY DEV! fuck saratov
</div>

</div>

<script>

function format(num){

return new Intl.NumberFormat(
'ru-RU'
).format(num);

}

function calculate(){

const rateLunch =
Number(
document.getElementById(
'rateLunch'
).value
);

const hours =
Number(
document.getElementById(
'hours'
).value
);

const salary =
rateLunch * hours;

const percents =
document.querySelectorAll(
'.kpiPercent'
);

const values =
document.querySelectorAll(
'.kpiValue'
);

let bonus = 0;

for(let i=0;i<4;i++){

bonus +=
Number(percents[i].value)
*
Number(values[i].value)
*
4;

}

const total =
salary + bonus;

document.getElementById(
'rateResult'
).innerText =
format(rateLunch) + ' ₽';

document.getElementById(
'salaryResult'
).innerText =
format(salary) + ' ₽';

document.getElementById(
'bonusResult'
).innerText =
format(bonus) + ' ₽';

document.getElementById(
'totalResult'
).innerText =
format(total) + ' ₽';

}

calculate();

</script>

</body>
</html>
